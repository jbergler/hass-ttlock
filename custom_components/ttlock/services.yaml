configure_passage_mode:
  name: Configure passage mode
  description: Configures passage mode for a lock (or set of locks). Uses Bluetooth or the WiFi proxy when one can reach the lock, otherwise the cloud. Setting passage mode on the lock is not yet confirmed on hardware.
  target:
    entity:
      integration: ttlock
      domain: lock
  fields:
    enabled:
      name: Enabled
      description: Should passage mode be active (if false, no other fields are required)
      required: true
      default: true
      selector:
        boolean:
    auto_unlock:
      name: Auto-unlock
      description: Should the lock auto unlock when passage mode starts. If you leave it out, the cloud turns it off, and the lock keeps its current setting.
      required: false
      selector:
        boolean:
    all_day:
      name: All day
      description: If set, the enabled setting applies 24/7. If not set then start_time, end_time and week_days is required.
      required: false
      default: false
      selector:
        boolean:
    start_time:
      name: Start time
      description: When passage mode should begin (only hour + minute, seconds are ignored)
      required: false
      default: "00:00"
      selector:
        time:
    end_time:
      name: End time
      description: When passage mode should end (only hour + minute, seconds are ignored)
      required: false
      default: "00:00"
      selector:
        time:
    days:
      name: Week days
      description: Which days should the passage mode schedule apply to?
      required: false
      default:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
      selector:
        select:
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun
          multiple: true
          mode: list

create_passcode:
  name: Create a new pass code
  description: Creates a passcode. Uses Bluetooth or the WiFi proxy when one can reach the lock, otherwise the cloud. If no start/end time is provided, the passcode will be valid forever.
  target:
    entity:
      integration: ttlock
      domain: lock
  fields:
    passcode_name:
      name: Pass code name
      description: The unique name of this pass code (Can be whatever you like)
      required: true
      default: My passcode name
      selector:
        text:
    passcode:
      name: Passcode
      description: The passcode that will be typed by the user to unlock the lock. (4-9 digits)
      required: true
      default: ""
      selector:
        text:
          type: number
    start_time:
      name: Start date / time
      description: What date/time pass code will become valid
      required: false
      selector:
        datetime:
    end_time:
      name: End date / time
      description: What date/time pass code will become invalid (not used for a cyclic code)
      required: false
      selector:
        datetime:
    code_type:
      name: Code type
      description: Count (one-time) and cyclic codes go on the lock only. Without a type, a code with a start/end time is a period code, and a code without one is permanent.
      required: false
      selector:
        select:
          options:
            - permanent
            - period
            - count
            - cyclic
    cycle_type:
      name: Cycle type
      description: For a cyclic code, the lock's 16-bit value (0-65535). It selects the days and the length of the daily window. The window opens at the time of day of Start date / time. Cyclic codes are not yet confirmed on hardware.
      required: false
      selector:
        number:
          min: 0
          max: 65535
          mode: box

modify_passcode:
  name: Modify an existing pass code
  description: Modifies an existing passcode. Uses the cloud with its ID, or the lock over Bluetooth or the WiFi proxy with its code. Changing a passcode on the lock is not yet confirmed on hardware.
  target:
    entity:
      integration: ttlock
      domain: lock
  fields:
    passcode_id:
      name: Pass code ID
      description: The ID of the passcode to modify, through the cloud. Give this or Code.
      required: false
      selector:
        number:
          min: 1
          mode: box
    code:
      name: Code
      description: The current passcode, to modify it on the lock. Give this or Pass code ID.
      required: false
      selector:
        text:
          type: number
    passcode_name:
      name: Pass code name
      description: The new name for this pass code (required with Pass code ID)
      required: false
      selector:
        text:
    passcode:
      name: Passcode
      description: The new passcode that will be typed by the user to unlock the lock. (4-9 digits, required with Pass code ID)
      required: false
      selector:
        text:
          type: number
    code_type:
      name: Code type
      description: With Code, the type the code was created as.
      required: false
      default: permanent
      selector:
        select:
          options:
            - permanent
            - period
            - count
            - cyclic
    start_time:
      name: Start date / time
      description: What date/time pass code will become valid
      required: false
      selector:
        datetime:
    end_time:
      name: End date / time
      description: What date/time pass code will become invalid
      required: false
      selector:
        datetime:

delete_passcode:
  name: Delete a pass code
  description: Deletes a specific passcode. Uses the cloud with its ID, or the lock over Bluetooth or the WiFi proxy with its code.
  target:
    entity:
      integration: ttlock
      domain: lock
  fields:
    passcode_id:
      name: Pass code ID
      description: The ID of the passcode to delete, through the cloud. Give this or Code.
      required: false
      selector:
        number:
          min: 1
    code:
      name: Code
      description: The passcode to delete on the lock. Give this or Pass code ID.
      required: false
      selector:
        text:
          type: number
    code_type:
      name: Code type
      description: With Code, the type the code was created as.
      required: false
      default: permanent
      selector:
        select:
          options:
            - permanent
            - period
            - count
            - cyclic

cleanup_passcodes:
  name: Remove expired passcodes
  description: Lists all passcodes for the selected lock and deletes ALL expired passcodes (where the end of validity date is older is past). Needs the cloud.
  target:
    entity:
      integration: ttlock
      domain: lock

list_passcodes:
  name: List passcodes
  description: Lists all passcodes for the selected lock, including their names, codes, and validity periods.
  target:
    entity:
      integration: ttlock
      domain: lock
  fields:
    source:
      name: Source
      description: Read the TTLock cloud, or the lock itself over Bluetooth or the WiFi proxy. Defaults to the cloud while it is on. The cloud has names and IDs, but not credentials added on the lock directly. The lock has those, but no names. It lists a cloud code only after someone has used it.
      required: false
      selector:
        select:
          options:
            - cloud
            - lock

list_records:
  name: List lock records
  description: Lists operation records for the selected lock. Records read from the lock come newest first. You can page them but not filter them by date.
  target:
    entity:
      integration: ttlock
      domain: lock
  fields:
    start_date:
      name: Start date
      description: Start date for record search (optional)
      required: false
      selector:
        datetime:
    end_date:
      name: End date
      description: End date for record search (optional)
      required: false
      selector:
        datetime:
    page_size:
      name: Page size
      description: Number of records to return (default 100, max 200)
      required: false
      default: 100
      selector:
        number:
          min: 1
          max: 200
    page_no:
      name: Page number
      description: Page number to return (default 1)
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 10
    source:
      name: Source
      description: Read the TTLock cloud, or the lock's own log over Bluetooth or the WiFi proxy. Defaults to the cloud while it is on. The lock's log has no user names and gives the lock's own record type numbers. Each call reads more of the log, oldest first, and Home Assistant keeps what it has read. The response's complete is false until a read reaches the newest record. A call reads about 30 records. With the cloud off and the WiFi proxy up, Home Assistant also reads the log in the background and keeps it current.
      required: false
      selector:
        select:
          options:
            - cloud
            - lock

configure_autolock:
  name: Configure Autolock
  description: Configure Autolock of the device. Uses Bluetooth or the WiFi proxy when one can reach the lock, otherwise the cloud.
  target:
    entity:
      integration: ttlock
      domain: lock
  fields:
    enabled:
      name: Enabled
      description: Should the Autolock feature for the lock be enabled?
      required: true
      default: false
      selector:
        boolean:
    seconds:
      name: Seconds
      description: How many seconds before the lock should Autolock? (0-900 secs | default 10). The lock may refuse a value outside its own range.
      required: false
      selector:
        number:
          min: 0
          max: 900
          unit_of_measurement: secs

update_state:
  name: Update State
  description: Forces a refresh of the lock state from the API.
  target:
    entity:
      integration: ttlock
      domain: lock

list_cards:
  name: List IC cards
  description: Lists all IC cards enrolled on the selected lock, including their names, numbers, and validity periods.
  target:
    entity:
      integration: ttlock
      domain: lock
  fields:
    source:
      name: Source
      description: Read the TTLock cloud, or the lock itself over Bluetooth or the WiFi proxy. Defaults to the cloud while it is on. The cloud has names and IDs, but not credentials added on the lock directly. The lock has those, but no names or IDs.
      required: false
      selector:
        select:
          options:
            - cloud
            - lock

rename_card:
  name: Rename an IC card
  description: Renames an IC card enrolled on the selected lock.
  target:
    entity:
      integration: ttlock
      domain: lock
  fields:
    card_id:
      name: Card ID
      description: The ID of the card to rename (from the List IC cards action)
      required: true
      selector:
        number:
          min: 1
          mode: box
    name:
      name: Card name
      description: The new name for this card
      required: true
      selector:
        text:

delete_card:
  name: Delete an IC card
  description: Deletes a specific IC card. Uses the cloud (via gateway or WiFi lock) with its ID, or the lock over Bluetooth or the WiFi proxy with its number.
  target:
    entity:
      integration: ttlock
      domain: lock
  fields:
    card_id:
      name: Card ID
      description: The ID of the card to delete (from the List IC cards action). Give this or Card number.
      required: false
      selector:
        number:
          min: 1
          mode: box
    card_number:
      name: Card number
      description: The number of the card to delete on the lock. Give this or Card ID.
      required: false
      selector:
        text:

add_card:
  name: Add an IC card
  description: Adds an IC card given its card number (for example from the List IC cards action on another lock). Uses Bluetooth or the WiFi proxy when one can reach the lock, otherwise the cloud (via gateway or WiFi lock). A card added on the lock has no card ID in the response. Adding a card on the lock is not yet confirmed on hardware.
  target:
    entity:
      integration: ttlock
      domain: lock
  fields:
    card_number:
      name: Card number
      description: The physical card number, as reported by the List IC cards action
      required: true
      selector:
        text:
    name:
      name: Card name
      description: The name for this card
      required: true
      selector:
        text:
    start_time:
      name: Start Time
      description: When the card becomes valid (leave empty with End Time for a permanent card)
      required: false
      selector:
        datetime:
    end_time:
      name: End Time
      description: When the card stops being valid (leave empty with Start Time for a permanent card)
      required: false
      selector:
        datetime:
    reversed_number:
      name: Reversed number
      description: Use for numbers read by an external reader in the opposite byte order (identityCard/addForReversedCardNumber). Needs the cloud.
      required: false
      default: false
      selector:
        boolean:

