  description: Sets the lock's clock over Bluetooth or the WiFi proxy, to Time if you give one, otherwise to now.
  target:
    entity:
      integration: ttlock
      domain: lock
  fields:
    time:
      name: Time
      description: The time to set (defaults to now).
      required: false
      selector:
