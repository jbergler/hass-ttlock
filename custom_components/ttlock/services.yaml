      integration: ttlock
      domain: lock
  fields:
    card_number:
      name: Card number
      description: The card's number.
      required: true
      selector:
        text:
    days:
      name: Week days
      description: The days the card may be used.
      required: true
      selector:
        select:
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun
          multiple: true
          mode: list
    start_time:
      name: Start time
      description: Time of day the window opens.
      required: true
      selector:
        time:
    end_time:
      name: End time
      description: Time of day the window closes.
      required: true
      selector:
        time:

clear_card_schedule:
