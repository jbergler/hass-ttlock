  target:
    entity:
      integration: ttlock
      domain: lock
  fields:
    card_number:
      name: Card number
      description: The card's number.
      required: true
      selector:
        text:
    start_time:
      name: Start date / time
      description: When the card becomes valid.
      required: true
      selector:
        datetime:
    end_time:
      name: End date / time
      description: When the card stops being valid.
      required: true
      selector:
        datetime:

